    <!-- Pick the sky from the visitor's local time before the page paints (preview with ?sky=night etc.) -->
    <script>
      (function () {
        var q = new URLSearchParams(location.search).get('sky');
        var h = new Date().getHours();
        var sky = h >= 5 && h < 11 ? 'morning' : h >= 11 && h < 17 ? 'day' : h >= 17 && h < 21 ? 'dusk' : 'night';
        if (['morning', 'day', 'dusk', 'night'].indexOf(q) > -1) sky = q;
        document.documentElement.setAttribute('data-sky', sky);
      })();
    </script>
